name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: tests/run
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          version=$(node -p 'require("./manifest.json").version')
          name=$(node -p 'require("./manifest.json").name')
          if [[ "$TAG" != "v$version" ]]; then
            echo "::error::Tag does not match manifest.json version"
            exit 1
          fi
          notes=".github/release-notes/$TAG.md"
          if [[ ! -f $notes ]]; then
            echo "::error::Missing $notes"
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release already exists; leaving it unchanged."
            exit 0
          fi
          gh release create "$TAG" --verify-tag --title "$name $version" \
            --notes-file "$notes" preview.png
